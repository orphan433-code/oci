name: OCI ARM Instance Grabber

on:
  schedule:
    # Минута не :00: в начале часа GitHub часто выкидывает отложенные schedule-запуски.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: oci-arm-grabber
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP and composer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php8.3 php8.3-cli php8.3-curl php8.3-mbstring
          curl -sS https://getcomposer.org/installer | php
          sudo mv composer.phar /usr/local/bin/composer

      - name: Install dependencies
        run: composer install --no-dev --no-interaction

      - name: Write OCI private key
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          OCI_REGION=${{ secrets.OCI_REGION }}
          OCI_USER_ID=${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID=${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT=${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME=/home/runner/.oci/oci_api_key.pem
          OCI_SUBNET_ID=${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID=${{ secrets.OCI_IMAGE_ID }}
          OCI_OCPUS=2
          OCI_MEMORY_IN_GBS=12
          OCI_SHAPE=VM.Standard.A1.Flex
          OCI_MAX_INSTANCES=1
          OCI_SSH_PUBLIC_KEY="${{ secrets.OCI_SSH_PUBLIC_KEY }}"
          OCI_AVAILABILITY_DOMAIN=EU-FRANKFURT-1-AD-3
          OCI_BOOT_VOLUME_ID=ocid1.bootvolume.oc1.eu-frankfurt-1.abtheljrlkufl4nm3rulia57us67ntufst3tlmpagk3mzhm7bac27gl2g62q
          OCI_BOOT_VOLUME_SIZE_IN_GBS=
          CACHE_AVAILABILITY_DOMAINS=1
          TOO_MANY_REQUESTS_TIME_WAIT=600
          EOF

      - name: Run script in loop
        id: grab
        run: |
          END=$((SECONDS + 55*60))
          ATTEMPT=0
          while [ $SECONDS -lt $END ]; do
            ATTEMPT=$((ATTEMPT+1))
            echo "=== Attempt #$ATTEMPT at $(date '+%H:%M:%S') ==="
            OUTPUT=$(php index.php 2>&1) || true
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "Already have an instance"; then
              echo "Instance already exists — stopping the chain."
              echo "continue=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if echo "$OUTPUT" | grep -q "ocid1.instance"; then
              echo "Instance created — stopping the chain."
              echo "continue=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if echo "$OUTPUT" | grep -q "TooManyRequests"; then
              echo "Rate limited — sleeping 10 minutes..."
              sleep 600
            else
              echo "Sleeping 1 minute..."
              sleep 60
            fi
          done
          echo "continue=true" >> "$GITHUB_OUTPUT"

      - name: Queue next run
        if: ${{ !cancelled() && steps.grab.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run oci.yml --ref "${{ github.ref_name }}"
          echo "Next run queued."
